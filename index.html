<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/drqa/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DRQA — Diagnose · Resolve · Quality Assurance. פלטפורמת אבחון API והנדסת QA אינטראקטיבית." />
    <meta name="color-scheme" content="dark light" />
    <title>DRQA · Diagnose · Resolve · Quality Assurance</title>
    <script>
      try {
        var t = localStorage.getItem('drqa-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        else document.documentElement.dataset.theme = 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
